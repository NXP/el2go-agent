#
# Non-TF-M variant: applied automatically when building for rd_rw612_bga_rw612.
# PSA Crypto and ITS are backed by the Zephyr ELS PKC driver and Zephyr Secure
# Storage directly (no TF-M). The ITS flash partition is declared in
# boards/rd_rw612_bga_rw612.overlay.

# ELS PKC hardware driver -- registers the NXP PSA driver into the mbedTLS
# PSA driver dispatch table. Without these three symbols the PSA core falls
# back to the software driver and rejects opaque key import (PSA_ERROR_NOT_PERMITTED).
CONFIG_MCUX_ELS_PKC=y
CONFIG_MCUX_PSA_CRYPTO_DRIVER_ELS_PKC=y
CONFIG_MCUX_PSA_CRYPTO_DRIVER_ELS_PKC_THREAD=y

# Use the built-in (source) mbedTLS rather than a pre-compiled library so that
# the ELS PKC driver can be compiled in.
CONFIG_MBEDTLS_BUILTIN=y

# Flash driver and FlexSPI memory controller (required by Secure Storage)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_MEMC=y
CONFIG_CODE_DATA_RELOCATION=y

# Zephyr Secure Storage -- PSA ITS backend backed by ZMS on flash
CONFIG_SECURE_STORAGE=y
CONFIG_SECURE_STORAGE_ITS_STORE_IMPLEMENTATION_ZMS=y
CONFIG_ZMS=y

# Maximum ITS entry size -- must be large enough to hold DER-encoded certificates
CONFIG_SECURE_STORAGE_ITS_MAX_DATA_SIZE=1024

# Hardware info -- used by Secure Storage to derive the ITS AEAD key from the device ID
CONFIG_HWINFO=y

# Heap size large enough for PSA crypto operations
CONFIG_HEAP_MEM_POOL_SIZE=65536
