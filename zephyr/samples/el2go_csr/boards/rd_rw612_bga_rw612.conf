# ---------------------------------------------------------------------------
# ELS PKC hardware crypto driver (RW61x S50 enclave, no TF-M)
# Auto-merged by Zephyr for the rd_rw612_bga board.
# ---------------------------------------------------------------------------
CONFIG_MCUX_ELS_PKC=y
CONFIG_MCUX_PSA_CRYPTO_DRIVER_ELS_PKC=y
CONFIG_MCUX_PSA_CRYPTO_DRIVER_ELS_PKC_THREAD=y

# mbedTLS user config: inject MBEDTLS_ASN1_WRITE_C (no Kconfig symbol exists for it)
CONFIG_MBEDTLS_USER_CONFIG_ENABLE=y
CONFIG_MBEDTLS_USER_CONFIG_FILE="el2go_csr_mbedtls_user_config_board.h"
