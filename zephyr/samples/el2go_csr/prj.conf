# ---------------------------------------------------------------------------
# PSA Crypto -- mbedTLS (no TF-M)
# ---------------------------------------------------------------------------
CONFIG_EL2GO_NET_CRYPTO_SOURCES=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=65536

# X.509 / CSR write support
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_MBEDTLS_X509_CRT_WRITE_C=y
CONFIG_MBEDTLS_X509_CSR_WRITE_C=y
CONFIG_MBEDTLS_PK_WRITE_C=y
CONFIG_MBEDTLS_PK_PARSE_C=y
CONFIG_MBEDTLS_PEM_WRITE_C=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_BASE64_C=y

# PSA algorithm/key-type wants for ECDSA P-256
CONFIG_PSA_CRYPTO_ENABLE_ALL=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y

# ---------------------------------------------------------------------------
# PSA ITS backend -- Zephyr SECURE_STORAGE subsystem backed by ZMS
# Replaces SDK secure_storage_its_initialize(); auto-initialised at boot.
# ---------------------------------------------------------------------------
CONFIG_SECURE_STORAGE=y
CONFIG_SECURE_STORAGE_ITS_STORE_IMPLEMENTATION_ZMS=y

# ZMS requires flash + flash map; FLASH_PAGE_LAYOUT is also needed for
# flash_erase() sector alignment and enables the FlexSPI NOR driver on RW612.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_ZMS=y

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HWINFO=y
CONFIG_PRINTK=y
