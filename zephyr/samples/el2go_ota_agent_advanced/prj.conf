# ---------------------------------------------------------------------------
# EL2GO OTA library + FWUAL
# ---------------------------------------------------------------------------
CONFIG_EL2GO_OTA_FWUAL_LIBRARY_SOURCES=y
CONFIG_EL2GO_OTA_LIBRARY_SOURCES=y

# EL2GO OTA server endpoint
CONFIG_EL2GO_OTA_SERVER_HOST=""
CONFIG_EL2GO_OTA_SERVER_PORT=50051

# Platform backend: auto-selected via Kconfig default for SOC_SERIES_RW6XX
CONFIG_EL2GO_OTA_PLATFORM_SOURCES=y

# Network backend: auto-selected (Zephyr WiFi when CONFIG_WIFI=y)
CONFIG_EL2GO_NETWORK_SOURCES=y
CONFIG_EL2GO_NET_WIFI_SSID=""
CONFIG_EL2GO_NET_WIFI_PSK=""

# Time backend: SNTP (requires network to be up first)
CONFIG_EL2GO_TIME_SOURCES=y
CONFIG_EL2GO_TIME_BACKEND_SNTP=y

# Agent state persistence backend: Zephyr NVS on agent_state_partition.
# Survives power loss for resume-on-boot and post-install reconciliation.
CONFIG_EL2GO_OTA_PERSIST_SOURCES=y
CONFIG_EL2GO_OTA_PERSIST_BACKEND_NVS=y

# System event backend: Zephyr net_mgmt (NET_EVENT_L4_CONNECTED) so the
# scheduler triggers a check immediately when the network comes up.
CONFIG_EL2GO_OTA_EVENT_SOURCES=y
CONFIG_EL2GO_OTA_EVENT_BACKEND_NETMGMT=y

# Logging / diagnostics backend: mirror to console (HIL test runner) and
# persist to a dedicated flash ring buffer (diag_log partition) so diagnostics
# survive reboot, power loss and firmware rollback.
CONFIG_EL2GO_OTA_DIAG_SOURCES=y
CONFIG_EL2GO_OTA_DIAG_BACKEND_RINGBUF=y

# System services backend: Zephyr (reboot, sleep)
CONFIG_EL2GO_SYSTEM_SOURCES=y

# ---------------------------------------------------------------------------
# ELS PKC hardware driver (RW61x S50 enclave, no TF-M)
# ---------------------------------------------------------------------------
CONFIG_MCUX_ELS_PKC=y
CONFIG_MCUX_PSA_CRYPTO_DRIVER_ELS_PKC=y
CONFIG_MCUX_PSA_CRYPTO_DRIVER_ELS_PKC_THREAD=y

# ---------------------------------------------------------------------------
# PSA Crypto - mbedTLS with ELS PKC driver (no TF-M)
# ---------------------------------------------------------------------------
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=65536

CONFIG_MBEDTLS_CFG_FILE="config-mbedtls.h"

CONFIG_MBEDTLS_HAVE_TIME_DATE=y

CONFIG_MBEDTLS_X509_CRT_WRITE_C=y
CONFIG_MBEDTLS_X509_CSR_WRITE_C=y
CONFIG_MBEDTLS_PK_WRITE_C=y

# TLS 1.2 support
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
CONFIG_MBEDTLS_SSL_ALPN=y

CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y

# PSA algorithm/key-type wants for mTLS with ECC P-256
CONFIG_PSA_CRYPTO_ENABLE_ALL=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_DETERMINISTIC_ECDSA=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_SHA_384=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y

# ---------------------------------------------------------------------------
# PSA ITS backend - Zephyr SECURE_STORAGE subsystem
# ---------------------------------------------------------------------------
CONFIG_SECURE_STORAGE=y
CONFIG_SECURE_STORAGE_ITS_STORE_IMPLEMENTATION_ZMS=y

# ZMS requires flash + flash map
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y

CONFIG_SECURE_STORAGE_ITS_MAX_DATA_SIZE=512

# ---------------------------------------------------------------------------
# Networking - TCP/IP stack for OTA server connection
# ---------------------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_BUF_DATA_SIZE=1744
CONFIG_ZVFS_OPEN_MAX=30

# NXP WiFi (RW61x)
CONFIG_WIFI=y
CONFIG_WIFI_NXP=y
CONFIG_NXP_RW610=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=20

# WPA supplicant
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_CRYPTO_ALT=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_CRYPTO_MBEDTLS_PSA=y

# Thread priorities
CONFIG_NET_TC_THREAD_PRIO_CUSTOM=y
CONFIG_NET_TC_THREAD_PREEMPTIVE=y
CONFIG_NET_TCP_WORKER_PRIO=-16
CONFIG_NET_TC_RX_THREAD_BASE_PRIO=3
CONFIG_NET_SOCKETS_SERVICE_THREAD_PRIO=3
CONFIG_NET_CONTEXT_PRIORITY=y
CONFIG_NET_MGMT_THREAD_PRIO_CUSTOM=y
CONFIG_NET_MGMT_THREAD_PRIORITY=3

# Connection manager - NET_EVENT_L4_CONNECTED for scheduler
CONFIG_NET_CONNECTION_MANAGER=y

# ---------------------------------------------------------------------------
# SNTP - time source for blackout policy
# ---------------------------------------------------------------------------
CONFIG_SNTP=y

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_POSIX_API=y
CONFIG_POSIX_TIMERS=y
CONFIG_HEAP_MEM_POOL_SIZE=131072
# Agent logic runs on the main thread (no worker thread), so the main stack
# must accommodate the full update/download/FWUAL call chain.
CONFIG_MAIN_STACK_SIZE=98304
CONFIG_HWINFO=y
CONFIG_PRINTK=y
CONFIG_REBOOT=y

CONFIG_LOG_PRINTK=n

# MCUBoot
CONFIG_MCUBOOT_BOOTUTIL_LIB=y
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y

CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--security-counter 2"

# NVS - used by FWUAL for update state persistence
CONFIG_NVS=y
CONFIG_FLASH_PAGE_LAYOUT=y

CONFIG_EL2GO_OTA_ADV_POLL_INTERVAL_S=10
CONFIG_EL2GO_OTA_ADV_RETRY_INITIAL_BACKOFF_S=5
CONFIG_EL2GO_OTA_ADV_RETRY_MAX_BACKOFF_S=30
CONFIG_EL2GO_OTA_ADV_DOWNLOAD_MAX_RETRIES=3
CONFIG_EL2GO_OTA_ADV_REPORT_MAX_RETRIES=3