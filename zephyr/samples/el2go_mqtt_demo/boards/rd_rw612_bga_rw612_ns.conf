# TF-M variant: applied automatically when building for rd_rw612_bga_rw612_ns.
# PSA Crypto and ITS are handled by the TF-M Secure Partition.

# TF-M secure side
CONFIG_BUILD_WITH_TFM=y
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y
CONFIG_EL2GO_TFM_LEGACY_CRYPTO_ENABLE=y

# TF-M IPC
CONFIG_TFM_IPC=y
CONFIG_TFM_ISOLATION_LEVEL=2

# Route PSA Crypto and ITS calls through the TF-M NS interface
CONFIG_EL2GO_RTP_PSA_BACKEND_TFM=y

# Stack and heap - TF-M NS variant shares RAM with the secure side
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_HEAP_MEM_POOL_SIZE=65536
