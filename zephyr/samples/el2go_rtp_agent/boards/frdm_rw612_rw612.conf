# Non-TF-M variant: applied automatically when building for frdm_rw612_rw612.
# PSA Crypto and ITS are backed by the Zephyr ELS PKC driver and Zephyr Secure
# Storage directly (no TF-M).

# ELS PKC hardware driver -- registers the NXP PSA driver into the mbedTLS
# PSA driver dispatch table. Without these three symbols the PSA core falls
# back to the software driver and rejects opaque key operations.
CONFIG_MCUX_ELS_PKC=y
CONFIG_MCUX_PSA_CRYPTO_DRIVER_ELS_PKC=y
CONFIG_MCUX_PSA_CRYPTO_DRIVER_ELS_PKC_THREAD=y

# FlexSPI memory controller (required for code relocation and WiFi firmware)
CONFIG_MEMC=y
CONFIG_CODE_DATA_RELOCATION=y

# Zephyr Secure Storage -- PSA ITS backend backed by ZMS on flash
CONFIG_SECURE_STORAGE=y
CONFIG_SECURE_STORAGE_ITS_STORE_IMPLEMENTATION_ZMS=y
CONFIG_SECURE_STORAGE_ITS_MAX_DATA_SIZE=2944
CONFIG_SECURE_STORAGE_ITS_STORE_ZMS_SECTOR_SIZE=8192
CONFIG_ZMS=y

# Flash driver (needed for WiFi firmware loading and ZMS-backed Secure Storage)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# Stack and heap - non-TF-M variant has full NS RAM available
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_HEAP_MEM_POOL_SIZE=131072
