# ---------------------------------------------------------------------------
# EL2GO RTP Agent
# ---------------------------------------------------------------------------
CONFIG_EL2GO_RTP_AGENT=y

# EdgeLock 2GO server connection (company-specific -- set before building)
# The hostname is shown in the EdgeLock 2GO portal under company settings.
CONFIG_EL2GO_RTP_EDGELOCK2GO_HOSTNAME=""
CONFIG_EL2GO_RTP_EDGELOCK2GO_PORT=443

# ---------------------------------------------------------------------------
# PSA Crypto - mbedTLS
# ---------------------------------------------------------------------------
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=65536

CONFIG_MBEDTLS_USER_CONFIG_ENABLE=y
CONFIG_MBEDTLS_USER_CONFIG_FILE="mbedtls_user_config.h"
CONFIG_MBEDTLS_X509_CRT_WRITE_C=y
CONFIG_MBEDTLS_X509_CSR_WRITE_C=y
CONFIG_MBEDTLS_PK_WRITE_C=y

# TLS 1.2 support
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
CONFIG_MBEDTLS_SSL_ALPN=y

CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y

# PSA algorithm/key-type wants for mTLS with ECC P-256
CONFIG_PSA_CRYPTO_ENABLE_ALL=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_SHA_384=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y

# ---------------------------------------------------------------------------
# Networking - TCP/IP stack
# ---------------------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_BUF_DATA_SIZE=1744
CONFIG_ZVFS_OPEN_MAX=30

# NXP WiFi (RW61x)
CONFIG_WIFI=y
CONFIG_WIFI_NXP=y
CONFIG_NXP_RW610=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=20

# WPA supplicant
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_CRYPTO_ALT=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_CRYPTO_MBEDTLS_PSA=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_THREAD_STACK_SIZE=16384

# Thread priorities
CONFIG_NET_TC_THREAD_PRIO_CUSTOM=y
CONFIG_NET_TC_THREAD_PREEMPTIVE=y
CONFIG_NET_TCP_WORKER_PRIO=-16
CONFIG_NET_TC_RX_THREAD_BASE_PRIO=3
CONFIG_NET_SOCKETS_SERVICE_THREAD_PRIO=3
CONFIG_NET_CONTEXT_PRIORITY=y
CONFIG_NET_MGMT_THREAD_PRIO_CUSTOM=y
CONFIG_NET_MGMT_THREAD_PRIORITY=3

# Network backend: WiFi
CONFIG_EL2GO_NETWORK_SOURCES=y

# WiFi credentials
CONFIG_EL2GO_NET_WIFI_SSID=""
CONFIG_EL2GO_NET_WIFI_PSK=""

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_POSIX_API=y
CONFIG_HWINFO=y
CONFIG_PRINTK=y

# Silence irrelevant driver noise on this board
# wpa_supplicant register_frame errors (op not supported by RW61x driver)
CONFIG_WIFI_LOG_LEVEL_OFF=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_LOG_LEVEL_OFF=y
# Ethernet PHY autoneg timeout (no cable connected, Wi-Fi only setup)
CONFIG_PHY_LOG_LEVEL_OFF=y
CONFIG_SECURE_STORAGE_LOG_LEVEL_OFF=y
CONFIG_ZMS_LOG_LEVEL_OFF=y

