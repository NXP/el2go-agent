#
# Combined overlay: object whitelisting + MQTT credential verification.
#
# Whitelisting is the default provisioning mode (no claimcode required).
# After provisioning the agent performs a TLS handshake against each enabled
# MQTT broker to confirm the credentials are usable.
#
# Usage:
#   west build -b <board> -- \
#     -DEXTRA_CONF_FILE="overlay-el2go-whitelisting.conf"
#
# Required: set your EL2GO hostname in prj.conf or via -DCONFIG_... :
#   CONFIG_EL2GO_RTP_EDGELOCK2GO_HOSTNAME="<company>.device-link.nxp.com"
#
# Required for AWS: set your AWS IoT Core endpoint:
#   CONFIG_EL2GO_RTP_MQTT_AWS_HOSTNAME="<account-id>-ats.iot.<region>.amazonaws.com"
#
# Required for Azure: optionally override the DPS global endpoint:
#   CONFIG_EL2GO_RTP_MQTT_AZURE_HOSTNAME="<your-hub>.azure-devices.net"

# -- MQTT credential verification --
CONFIG_EL2GO_RTP_MQTT_VERIFY=y

# Enable the AWS IoT Core backend (comment out if not needed)
CONFIG_EL2GO_RTP_MQTT_AWS=y
CONFIG_EL2GO_RTP_MQTT_AWS_HOSTNAME="<your-aws-iot-endpoint>"

# Enable the Azure IoT Hub backend (comment out if not needed)
CONFIG_EL2GO_RTP_MQTT_AZURE=y
# CONFIG_EL2GO_RTP_MQTT_AZURE_HOSTNAME="global.azure-devices-provisioning.net"
CONFIG_EL2GO_RTP_MQTT_AZURE_ID_SCOPE="<your-azure-id-scope>"

# PSA key/cert IDs assigned by EL2GO to the MQTT credentials
CONFIG_EL2GO_RTP_MQTT_AWS_KEY_ID=0x83000101
CONFIG_EL2GO_RTP_MQTT_AWS_CERT_ID=0x83000102
CONFIG_EL2GO_RTP_MQTT_AZURE_KEY_ID=0x83000211
CONFIG_EL2GO_RTP_MQTT_AZURE_CERT_ID=0x83000212
