# ---------------------------------------------------------------------------
# ELS PKC hardware driver (RW61x S50 enclave)
# Required for ECC keypair gen, ECDH, CKDF, AES-CBC, AES-CMAC
# ---------------------------------------------------------------------------
CONFIG_MCUX_ELS_PKC=y

# ---------------------------------------------------------------------------
# Device hardware info (used to read UID in iot_agent_claimcode_encrypt_els.c)
# ---------------------------------------------------------------------------
CONFIG_HWINFO=y

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_REQUIRES_FULL_LIBC=y
