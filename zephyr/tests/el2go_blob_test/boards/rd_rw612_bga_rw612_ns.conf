# TF-M variant: applied automatically when building for this board.

# TF-M secure side
CONFIG_BUILD_WITH_TFM=y
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y
CONFIG_EL2GO_TFM_LEGACY_CRYPTO_ENABLE=y

# EL2GO data import region -- exposes provisioned blob flash area to NSPE
CONFIG_EL2GO_TFM_DATA_IMPORT_REGION=y

# TF-M IPC
CONFIG_TFM_IPC=y
CONFIG_TFM_ISOLATION_LEVEL=2
